<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">SwiftHaul South Africa — Move, Deliver, Grow</title>
<desc id="desc">A vertical SwiftHaul brand banner with a circular delivery van emblem, South African-inspired accents and a delivery vehicle against a city skyline.</desc>
<defs>
 <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset=".58" stop-color="#0b2848"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#0284c7" stop-opacity=".08"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="720" height="900" fill="url(#bgm)"/>
<circle cx="560" cy="300" r="205" fill="#0ea5e9" opacity=".15" filter="url(#soft)"/>
