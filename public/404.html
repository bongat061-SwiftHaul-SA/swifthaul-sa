<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0e">
  <title>SwiftHaul SA · Page not found</title>
  <style>
    :root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b0e;color:#f4f6f8;font:16px/1.5 system-ui,sans-serif}.card{width:min(560px,calc(100% - 40px));box-sizing:border-box;padding:32px;border:1px solid #303945;border-radius:20px;background:#13181e}.brand{font-weight:900;letter-spacing:.16em}.brand span{color:#9aa5b1}h1{font-size:clamp(28px,6vw,42px);margin:34px 0 10px}.muted{color:#aab4bf}a{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:10px;background:#e9edf1;color:#101419;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">SWIFTHAUL <span>SA</span></div>
    <h1>That page has moved</h1>
    <p class="muted">We’re taking you back to the correct SwiftHaul page.</p>
    <a id="fallback-link" href="/customer.html">Return to SwiftHaul</a>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var link = document.getElementById("fallback-link");
      if (code) {
        link.href = "/track.html?code=" + encodeURIComponent(code);
        window.location.replace("/track.html?code=" + encodeURIComponent(code));
      }
    })();
  </script>
</body>
</html>
