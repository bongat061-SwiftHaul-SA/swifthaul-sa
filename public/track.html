</style><script defer src="order-chat.js?v=20261112"></script><script type="module" src="track-page.js?v=20261112"></script></head><body data-app="customer"><main class="track-wrap"><div class="track-brand">SWIFTHAUL <span>SA</span></div><section class="track-card"><p class="track-eyebrow">DELIVERY TRACKING</p><h1>Track your delivery</h1><p id="track-status" class="track-note" role="status">Checking your tracking link…</p><div id="track-content" hidden><p id="track-state" class="track-status"></p><p id="track-waybill" class="track-note"></p><div class="track-route"><div class="track-stop"><small>PICKUP</small><p id="track-pickup"></p></div><div class="track-stop"><small>DROP-OFF</small><p id="track-dropoff"></p></div></div><div class="track-actions"><button id="track-chat" type="button">Chat about delivery</button></div><p class="track-note">Chat is limited to this delivery. Contact numbers are not shown. Chat becomes read-only 15 minutes after delivery or cancellation.</p></div></section></main></body></html>
