<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">SwiftHaul South Africa — Move, Deliver, Grow</title>
<desc id="desc">SwiftHaul's circular delivery-van emblem, South African flag accents and brand message on a deep navy background.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset=".55" stop-color="#0b2848"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#0ea5e9" stop-opacity=".22"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="600" fill="url(#bg)"/>
<circle cx="330" cy="300" r="300" fill="url(#halo)"/>
<circle cx="1320" cy="310" r="310" fill="url(#halo)" opacity=".55"/>
<path d="M0 510H1600" stroke="#38bdf8" stroke-opacity=".22" stroke-width="2"/>
<g opacity=".2" fill="none" stroke="#38bdf8"><path d="M980 500C1080 390 1100 420 1180 300s120-110 210-170" stroke-width="3"/><path d="M1000 500C1110 390 1125 435 1205 315s125-110 220-170" stroke-width="1.5" stroke-dasharray="8 12"/></g>
<g fill="#67e8f9"><circle cx="980" cy="500" r="8"/><circle cx="1180" cy="300" r="8"/><circle cx="1390" cy="130" r="8"/></g>
<image href="/icon.svg" x="100" y="90" width="420" height="420" preserveAspectRatio="xMidYMid meet"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="610" y="235" fill="#fff" font-size="78" font-weight="900" letter-spacing="-2">SwiftHaul <tspan fill="#38bdf8">SA</tspan></text>
 <text x="616" y="315" fill="#dbeafe" font-size="34" font-weight="800" letter-spacing="8">MOVE • DELIVER • GROW</text>
 <rect x="616" y="355" width="500" height="5" rx="2.5" fill="url(#cyan)"/>
 <text x="616" y="415" fill="#9fb4ca" font-size="24" font-weight="700" letter-spacing="3">SMARTER LOGISTICS.</text>
 <text x="616" y="452" fill="#9fb4ca" font-size="24" font-weight="700" letter-spacing="3">A STRONGER SOUTH AFRICA.</text>
</g>
<g transform="translate(1270 440)"><path d="M0 0h210" stroke="#16a34a" stroke-width="8"/><path d="M0 14h210" stroke="#fff" stroke-width="8"/><path d="M0 28h210" stroke="#de3831" stroke-width="8"/></g>
</svg>