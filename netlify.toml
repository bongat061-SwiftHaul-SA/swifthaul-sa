[build]
  publish = "public"
[functions]
  directory = "netlify/functions"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# Deploy Previews expose all three browser apps for testing. Production keeps [build].publish = "public".
[context.deploy-preview]
  command = "node scripts/prepare-preview.cjs"
  publish = "preview-dist"
