name: Build SwiftHaul Android preview APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-capacitor-foundation
    paths:
      - 'android-customer/**'
      - 'apps/driver/android-wrapper/**'
      - 'apps/company/android-wrapper/**'
      - 'scripts/copy-android-web.cjs'
      - 'docs/android-apps.md'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} debug APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Customer
            app: android-customer
          - label: Driver
            app: apps/driver/android-wrapper
          - label: Company Admin
            app: apps/company/android-wrapper

    steps:
      - name: Check out Android wrapper development branch
        uses: actions/checkout@v4

      - name: Check out the exact source branch used by the new preview site
        uses: actions/checkout@v4
        with:
          repository: bongat061-SwiftHaul-SA/swifthaul-sa
          ref: feature/secure-driver-live-location
          path: preview-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        working-directory: ${{ matrix.app }}
        run: npm install

      - name: Generate Android project
        working-directory: ${{ matrix.app }}
        run: npx cap add android

      - name: Copy matching preview interface and sync native project
        working-directory: ${{ matrix.app }}
        env:
          SWIFTHAUL_SOURCE_DIR: ${{ github.workspace }}/preview-source
        run: npm run cap:sync

      - name: Verify the packaged interface is the preview version
        working-directory: ${{ matrix.app }}
        run: |
          test -f www/index.html
          grep -R -q '20261107' www
          if [ "${{ matrix.label }}" = "Customer" ]; then
            grep -q 'customer-multi-pages-20261107' www/index.html
          elif [ "${{ matrix.label }}" = "Driver" ]; then
            grep -q 'driver-home-uber-refresh-20261107' www/index.html
          else
            grep -q 'company-web-console-20261107' www/index.html
          fi

      - name: Assemble debug APK
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: swifthaul-${{ matrix.label }}-new-preview-debug-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
