name: Validate SwiftHaul notifications and stacked dispatch
on:
  pull_request:
    paths:
      - "supabase/functions/_shared/notifications.ts"
      - "supabase/functions/notification-dispatch/**"
      - "supabase/functions/messaging-webhook/**"
      - "supabase/functions/dispatch-offers/**"
      - "supabase/functions/dispatch-operations/**"
      - "supabase/functions/driver-sos/**"
      - "supabase/functions/sos-operations/**"
      - "supabase/functions/order-chat/**"
      - "supabase/migrations/*order_chat_and_driver_sos*"
      - "apps/driver/public/sos.js"
      - "apps/company/public/sos-admin.js"
      - "public/order-chat.js"
      - "tests/chat-sos-static-check.cjs"
      - "supabase/migrations/*stacked_driver_delivery_capacity*"
      - "apps/driver/public/operations.js"
      - "apps/company/public/operations.js"
      - "apps/driver/public/dark-premium.css"
      - "apps/company/public/unified-workspace-dark.css"
      - "tests/stacked-delivery-static-check.cjs"
      - "supabase/migrations/*unified_sms_whatsapp_notification_queue*"
      - "apps/company/public/notification-admin.*"
      - "apps/company/public/index.html"
      - "apps/company/public/section-pages.js"
      - "tests/notification-service-static-check.cjs"
      - ".github/workflows/validate-notification-service.yml"
  push:
    branches:
      - feature/sa-sms-whatsapp-notifications-staging
    paths:
      - "supabase/functions/_shared/notifications.ts"
      - "supabase/functions/notification-dispatch/**"
      - "supabase/functions/messaging-webhook/**"
      - "supabase/functions/dispatch-offers/**"
      - "supabase/functions/dispatch-operations/**"
      - "supabase/migrations/*stacked_driver_delivery_capacity*"
      - "apps/driver/public/operations.js"
      - "apps/company/public/operations.js"
      - "apps/driver/public/dark-premium.css"
      - "apps/company/public/unified-workspace-dark.css"
      - "tests/stacked-delivery-static-check.cjs"
      - "supabase/migrations/*unified_sms_whatsapp_notification_queue*"
      - "apps/company/public/notification-admin.*"
      - "apps/company/public/index.html"
      - "apps/company/public/section-pages.js"
      - "tests/notification-service-static-check.cjs"
      - ".github/workflows/validate-notification-service.yml"
permissions:
  contents: read
jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check Deno Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/notification-dispatch/index.ts
          deno check --node-modules-dir=auto supabase/functions/messaging-webhook/index.ts
          deno check --node-modules-dir=auto supabase/functions/dispatch-offers/index.ts
          deno check --node-modules-dir=auto supabase/functions/dispatch-operations/index.ts
          deno check --node-modules-dir=auto supabase/functions/driver-sos/index.ts
          deno check --node-modules-dir=auto supabase/functions/sos-operations/index.ts
          deno check --node-modules-dir=auto supabase/functions/order-chat/index.ts
      - name: Check dashboard interface syntax
        run: |
          node --check apps/company/public/notification-admin.js
          node --check apps/company/public/operations.js
          node --check apps/driver/public/operations.js
          node --check apps/driver/public/sos.js
          node --check apps/company/public/sos-admin.js
          node --check public/order-chat.js
      - name: Verify chat and SOS security wiring
        run: node tests/chat-sos-static-check.cjs
      - name: Verify notification security and admin audit wiring
        run: node tests/notification-service-static-check.cjs
