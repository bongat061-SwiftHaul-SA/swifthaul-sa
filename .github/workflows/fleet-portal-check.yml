name: Fleet portal validation
on:
  push:
    branches: [feature/sa-sms-whatsapp-notifications-staging]
    paths:
      - 'apps/fleet/**'
      - '.github/workflows/fleet-portal-check.yml'
  pull_request:
    paths:
      - 'apps/fleet/**'
      - '.github/workflows/fleet-portal-check.yml'
jobs:
  nextjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/fleet/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
