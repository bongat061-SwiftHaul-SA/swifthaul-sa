name: Publish SwiftHaul platforms to GitHub Pages

on:
  push:
    branches:
      - migration/supabase-github-pages
  workflow_dispatch:

# Publishing the three platform entry points from this migration branch.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify three platform entry points
        run: |
          test -f index.html
          test -f public/customer.html
          test -f apps/driver/public/index.html
          test -f apps/company/public/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
