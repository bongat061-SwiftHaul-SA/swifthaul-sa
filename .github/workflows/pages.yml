name: Publish SwiftHaul platforms to GitHub Pages

on:
  push:
    branches:
      - main
      - migration/supabase-github-pages
      - feature/customer-smart-address-estimator
      - feature/secure-driver-live-location
  workflow_dispatch:

# The existing Pages hostname is shared by the three app paths.
# Build the independent app bundles before publishing; never publish the source tree.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build three independent platform bundles
        run: npm run build:pages
      - name: Verify generated platform entry points
        run: |
          test -f dist/index.html
          test -f dist/customer/customer.html
          test -f dist/driver/index.html
          test -f dist/company/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
