name: Publish SwiftHaul platforms to GitHub Pages

on:
  # Live Pages publication is controlled by the protected main-branch workflow.
  # Staging pushes run browser validation and previews only.
  workflow_dispatch:

# The existing Pages hostname is shared by the three app paths.
# Build the independent app bundles before publishing; never publish the source tree.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4
      - name: Check out production baseline for unchanged platforms
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build all three platforms from main first. On the approved staging
      # branch, replace ONLY the Customer bundle with the tested staging build.
      - name: Build production baseline platforms
        working-directory: production
        run: npm run build:pages
      - name: Build staging platform bundles
        run: npm run build:pages
      - name: Publish only the corrected staging Customer bundle
        run: |
          rm -rf production/dist/customer
          cp -a dist/customer production/dist/customer
      - name: Verify generated platform entry points
        working-directory: production
        run: |
          test -f dist/index.html
          test -f dist/customer/index.html
          test -f dist/customer/customer.html
          test -f dist/driver/index.html
          test -f dist/company/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
