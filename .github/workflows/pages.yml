name: Publish SwiftHaul platforms to GitHub Pages

on:
  # Run the approved Customer-only publication manually after browser validation.
  # Staging pushes run browser validation and previews only.
  workflow_dispatch:

# The existing Pages hostname is shared by the three app paths.
# Build the independent app bundles before publishing; never publish the source tree.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4
      - name: Check out production baseline for unchanged platforms
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The static Pages baseline does not use Netlify Identity. Older main
      # commits may not contain the legacy feature marker, so make that copy
      # conditional in this runner checkout only (never modify main).
      - name: Make legacy Netlify Identity marker optional for static build
        working-directory: production
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/prepare-sites.cjs';
          let source = fs.readFileSync(file, 'utf8');
          const oldLine = "    fs.copyFileSync(path.join(root, '.netlify/features/netlify-identity'), path.join(features, 'netlify-identity'));";
          const newLine = "    const identityMarker = path.join(root, '.netlify/features/netlify-identity');\n    if (fs.existsSync(identityMarker)) fs.copyFileSync(identityMarker, path.join(features, 'netlify-identity'));";
          if (!source.includes(oldLine)) throw new Error('Expected legacy Identity copy line was not found; stopping safely.');
          fs.writeFileSync(file, source.replace(oldLine, newLine));
          NODE
      # Build all three platforms from main first. On the approved staging
      # branch, replace ONLY the Customer bundle with the tested staging build.
      - name: Build production baseline platforms
        working-directory: production
        run: npm run build:pages
      - name: Build staging platform bundles
        run: npm run build:pages
      - name: Publish only the corrected staging Customer bundle
        run: |
          rm -rf production/dist/customer
          cp -a dist/customer production/dist/customer
      - name: Verify generated platform entry points
        working-directory: production
        run: |
          test -f dist/index.html
          test -f dist/customer/index.html
          test -f dist/customer/customer.html
          test -f dist/driver/index.html
          test -f dist/company/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
