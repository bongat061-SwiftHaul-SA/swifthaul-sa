name: SwiftHaul three-platform browser smoke tests
on:
  push:
    branches:
      - feature/sa-sms-whatsapp-notifications-staging
    paths:
      - "public/**"
      - "apps/driver/public/**"
      - "apps/company/public/**"
      - "shared/**"
      - "scripts/build-pages.cjs"
      - "scripts/prepare-sites.cjs"
      - "tests/three-platform-browser-smoke.cjs"
      - ".github/workflows/validate-three-platform-browser.yml"
  pull_request:
    paths:
      - "public/**"
      - "apps/driver/public/**"
      - "apps/company/public/**"
      - "shared/**"
      - "scripts/build-pages.cjs"
      - "scripts/prepare-sites.cjs"
      - "tests/three-platform-browser-smoke.cjs"
      - ".github/workflows/validate-three-platform-browser.yml"
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build independent browser apps
        run: npm run build:pages
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Customer, Driver and Company Admin
        run: node tests/three-platform-browser-smoke.cjs
