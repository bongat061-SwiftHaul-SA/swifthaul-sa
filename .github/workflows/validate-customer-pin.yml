name: Validate customer signup pin flow

on:
  pull_request:
    paths:
      - "public/customer.html"
      - "public/auth.js"
      - "public/location-picker.js"
      - "public/address-autocomplete.js"
      - "public/customer.js"
      - "public/booking-wizard.js"
      - "public/booking-wizard.css"
      - "public/customer-pages.js"
      - "public/premium-shell.js"
      - "tests/booking-wizard-static-check.cjs"
      - "apps/driver/public/map.html"
      - "tests/customer-pin-static-check.cjs"
      - ".github/workflows/validate-customer-pin.yml"

permissions:
  contents: read

jobs:
  customer-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check customer map scripts
        run: |
          node --input-type=module --check < public/location-picker.js
          node --input-type=module --check < public/address-autocomplete.js
          node --input-type=module --check < public/customer.js
          node --check public/booking-wizard.js
          node --check public/customer-pages.js
          node --check public/premium-shell.js
      - name: Verify booking wizard and in-app navigation
        run: node tests/booking-wizard-static-check.cjs
      - name: Verify signup-to-pin wiring
        run: node tests/customer-pin-static-check.cjs
