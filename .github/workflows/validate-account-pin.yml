name: Validate Customer and Driver PIN authentication

on:
  pull_request:
    paths:
      - "public/auth.js"
      - "apps/driver/public/auth.js"
      - "apps/company/public/auth.js"
      - "public/index.html"
      - "public/customer.html"
      - "public/customer-pages.js"
      - "public/settings.html"
      - "apps/driver/public/section-pages.js"
      - "apps/driver/public/premium-shell.js"
      - "public/premium-shell.js"
      - "tests/booking-wizard-static-check.cjs"
      - "public/wallet.html"
      - "apps/driver/public/index.html"
      - "apps/company/public/index.html"
      - "apps/driver/public/map.html"
      - "apps/company/public/map.html"
      - "public/dark-premium.css"
      - "apps/driver/public/dark-premium.css"
      - "public/unified-workspace-dark.css"
      - "apps/driver/public/unified-workspace-dark.css"
      - "apps/company/public/unified-workspace-dark.css"
      - "tests/unified-dark-theme-static-check.cjs"
      - "apps/driver/public/account-settings.js"
      - "supabase/functions/driver-settings/**"
      - "supabase/functions/customer-settings/**"
      - "supabase/functions/account-deletion-admin/**"
      - "apps/company/public/account-deletions.js"
      - "apps/company/public/index.html"
      - "apps/company/public/section-pages.js"
      - "tests/account-deletion-admin-static-check.cjs"
      - "tests/popia-consent-static-check.cjs"
      - "public/popia-consent.js"
      - "apps/driver/public/popia-consent.js"
      - "public/privacy-policy.html"
      - "apps/driver/public/privacy-policy.html"
      - "supabase/migrations/*account_self_service*"
      - "public/supabase-config.js"
      - "apps/driver/public/supabase-config.js"
      - "supabase/functions/account-pin/**"
      - "supabase/functions/account-signin-notify/**"
      - "supabase/functions/customer-welcome-notify/**"
      - "supabase/functions/driver-application-notify/**"
      - "supabase/migrations/*account_signin_notifications*" 
      - "tests/auth-email-notifications-static-check.cjs"
      - "supabase/migrations/*login_pins*"
      - "tests/account-pin-static-check.cjs"
      - "tests/account-self-service-static-check.cjs"
      - ".github/workflows/validate-account-pin.yml"

permissions:
  contents: read

jobs:
  account-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < public/auth.js
          node --input-type=module --check < apps/driver/public/auth.js
          node --input-type=module --check < apps/company/public/auth.js
          node --check public/customer-pages.js
          node --check apps/driver/public/section-pages.js
          node --check public/premium-shell.js
          node --check apps/driver/public/premium-shell.js
          node --check apps/company/public/section-pages.js
          node --check apps/driver/public/account-settings.js
          node --check public/settings.js
          node --check apps/company/public/account-deletions.js
          node --check public/popia-consent.js
          node --check apps/driver/public/popia-consent.js
      - name: Verify booking wizard and in-app navigation
        run: node tests/booking-wizard-static-check.cjs
      - name: Verify unified dark-premium interface across apps
        run: node tests/unified-dark-theme-static-check.cjs
      - name: Verify account email notification wiring
        run: node tests/auth-email-notifications-static-check.cjs
      - name: Verify secure PIN wiring
        run: node tests/account-pin-static-check.cjs
      - name: Verify account self-service flows
        run: node tests/account-self-service-static-check.cjs
      - name: Verify administrator deletion review
        run: node tests/account-deletion-admin-static-check.cjs
      - name: Verify POPIA signup consent and separate marketing opt-in
        run: node tests/popia-consent-static-check.cjs
